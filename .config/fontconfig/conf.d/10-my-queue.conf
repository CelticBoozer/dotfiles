<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Register "my-queue" as a generic monospace family -->
  <alias>
    <family>my-queue</family>
    <default>
      <family>monospace</family>
    </default>
  </alias>
  <!-- Override font evaluation stack for "my-queue" -->
  <match target="pattern">
    <test name="family">
      <string>my-queue</string>
    </test>
    <!-- Set main font for primary text -->
    <edit binding="strong" mode="assign" name="family">
      <string>JetBrains Mono</string>
    </edit>
    <!-- Append Nerd Font icons for missing glyphs -->
    <edit binding="weak" mode="append" name="family">
      <string>Symbols Nerd Font Mono</string>
    </edit>
    <!-- Append secondary fallback -->
    <edit binding="weak" mode="append" name="family">
      <string>Hack</string>
    </edit>
  </match>
</fontconfig>
