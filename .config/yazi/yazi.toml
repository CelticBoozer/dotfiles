# -------------------------
# Yazi File Manager Config
# -------------------------
[mgr]
# Panel size ratio (left, middle, right)
ratio = [1, 2, 3]

# Sort using natural order (e.g., file10 after file2)
sort_by = "natural"

# Sort case-insensitively
sort_sensitive = false

# Sort in normal order
sort_reverse = false

# Sort directories first
sort_dir_first = true

# Apply transliteration to sort non-ASCII names properly
sort_translit = true

# Show file size in the list view
linemode = "size"

# Don't show hidden files
show_hidden = false

# Show the path of the symlink file
show_symlink = true

# Number of lines to keep above/below the cursor when scrolling
scrolloff = 10

# Mouse events to capture
mouse_events = ["click", "scroll"]

# Format string for the title bar
title_format = ""


[preview]
# Wrap long lines
wrap = "yes"

# Number of spaces per tab
tab_size = 2

# Max width/height of previewed images (in pixels)
max_width = 720
max_height = 1280

# Image preview delay in milliseconds
image_delay = 100

# Image downscaling filter to use
image_filter = "catmull-rom"

# Image quality (50-90)
image_quality = 50


[opener]
# Opener to use for opening files
play = [{ run = "mpv %s", orphan = true, for = "unix" }]
edit = [{ run = "kitty -e $EDITOR %s", orphan = true, for = "unix" }]
open = [{ run = "xdg-open %s", desc = "Open" }]

[open]
rules = [
  { mime = "text/*", use = "edit" },
  { mime = "video/*", use = "play" },
  { mime = "audio/*", use = "play" },
  { mime = "*", use = "open" },
]
